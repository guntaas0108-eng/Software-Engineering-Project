services:
  - type: web
    name: propertypulse-platform
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python realestate_platform/manage.py migrate --noinput"
    startCommand: "daphne -b 0.0.0.0 -p $PORT --root-path=realestate_platform config.asgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONPATH
        value: "realestate_platform"
